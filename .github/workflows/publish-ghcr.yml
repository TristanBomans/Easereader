name: Build and deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: easereader-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tristanbomans/easereader

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 image for the Raspberry Pi.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # deploy.trisbom.com only accepts immutable sha-<full commit> tags.
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        run: |
          # Best-effort: package may already be public or need a UI toggle.
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/easereader/visibility" \
            -d '{"visibility":"public"}' || true

      - name: Deploy through the allowlisted worker
        env:
          DEPLOY_EDGE_KEY: ${{ secrets.DEPLOY_EDGE_KEY }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$DEPLOY_EDGE_KEY" || { echo "DEPLOY_EDGE_KEY is required" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 15 \
            --header "X-Deploy-Key: $DEPLOY_EDGE_KEY" \
            https://deploy.trisbom.com/health > /dev/null
          timestamp=$(date +%s)
          delivery=$(cat /proc/sys/kernel/random/uuid)
          body=$(jq -cn \
            --arg project "easereader" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            '{project:$project,repository:$repository,commit:$commit}')
          signature=$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | awk '{print $2}')
          registry_auth=$(jq -cn \
            --arg username "$GITHUB_REPOSITORY_OWNER" \
            --arg password "$REGISTRY_TOKEN" \
            '{username:$username,password:$password}' | base64 -w 0)
          curl --fail-with-body --silent --show-error \
            --max-time 180 \
            --request POST https://deploy.trisbom.com/deploy \
            --header "X-Deploy-Key: $DEPLOY_EDGE_KEY" \
            --header "Content-Type: application/json" \
            --header "X-Deploy-Timestamp: $timestamp" \
            --header "X-Deploy-Signature: sha256=$signature" \
            --header "X-Deploy-Delivery: $delivery" \
            --header "X-Registry-Auth: $registry_auth" \
            --data "$body"

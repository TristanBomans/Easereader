name: Publish PR test image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          repository: TristanBomans/Easereader-upstream
          ref: 7144b59f376a85978acea239b0b3affa856385c2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish PR test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tristanbomans/easereader:pr-1
            ghcr.io/tristanbomans/easereader:pr-1-7144b59
          labels: |
            org.opencontainers.image.source=https://github.com/TristanBomans/Easereader
            org.opencontainers.image.revision=7144b59f376a85978acea239b0b3affa856385c2
          cache-from: type=gha
          cache-to: type=gha,mode=max
